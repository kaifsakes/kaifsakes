<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="250" height="72" viewBox="0 0 250 72" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .m{font-family:'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.06em}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,20px)}}
  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,30px)}}
  .o1{animation:drift1 14s ease-in-out infinite}
  .o2{animation:drift2 18s ease-in-out infinite}
  .o3{animation:drift3 16s ease-in-out infinite}
  
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="outer301"><rect width="250" height="72" rx="36"/></clipPath></defs>
<g clip-path="url(#outer301)">
<defs><filter id="wb295" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
<g id="bg294"><rect width="250" height="72" fill="#050b14"/><g filter="url(#wb295)"><circle cx="63" cy="35" r="70" fill="#1b3a5c" opacity="0.6"/><circle cx="140" cy="1" r="85" fill="#3fbfa8" opacity="0.6"/><circle cx="218" cy="40" r="55" fill="#0f5e63" opacity="0.6"/><circle cx="45" cy="6" r="70" fill="#f4c2c2" opacity="0.6"/></g></g></defs><use href="#bg294" xlink:href="#bg294"/>
<defs>
  <clipPath id="c296"><rect x="6" y="6" width="238" height="60" rx="30"/></clipPath>
  <filter id="f297" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/><feColorMatrix type="saturate" values="1.6"/></filter>
  <filter id="sh300" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="rgba(0,0,0,0.55)"/></filter>
  <linearGradient id="r298" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="rgba(255,255,255,0.55)"/><stop offset=".5" stop-color="rgba(255,255,255,0.06)"/><stop offset="1" stop-color="rgba(255,255,255,0.22)"/>
  </linearGradient>
  <linearGradient id="s299" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="rgba(255,255,255,0.14)"/><stop offset=".5" stop-color="rgba(255,255,255,0.14)" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="6" y="6" width="238" height="60" rx="30" fill="#050b14" opacity=".35" filter="url(#sh300)"/>
<g clip-path="url(#c296)">
  <use href="#bg294" xlink:href="#bg294" filter="url(#f297)"/>
  <rect x="6" y="6" width="238" height="60" fill="rgba(6,14,26,0.6)"/>
  <rect x="6" y="6" width="238" height="60" fill="url(#s299)"/>
</g>
<rect x="6.75" y="6.75" width="236.5" height="58.5" rx="29.25" fill="none" stroke="url(#r298)" stroke-width="1.5"/>
<g transform="translate(46 36)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#f2f6f8"/><text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#000">in</text></g>
<text x="70" y="43" class="t" font-size="20" font-weight="600" fill="#f2f6f8">LinkedIn</text>
</g>

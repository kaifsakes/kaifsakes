<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="250" height="72" viewBox="0 0 250 72" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .m{font-family:'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.06em}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,20px)}}
  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,30px)}}
  .o1{animation:drift1 14s ease-in-out infinite}
  .o2{animation:drift2 18s ease-in-out infinite}
  .o3{animation:drift3 16s ease-in-out infinite}
  
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="outer626"><rect width="250" height="72" rx="36"/></clipPath></defs>

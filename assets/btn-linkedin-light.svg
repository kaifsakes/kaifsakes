</g>
<rect x="6.75" y="6.75" width="236.5" height="58.5" rx="29.25" fill="none" stroke="url(#r623)" stroke-width="1.5"/>
<g transform="translate(46 36)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#0e1a2b"/><text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#fff">in</text></g>
<text x="70" y="43" class="t" font-size="20" font-weight="600" fill="#0e1a2b">LinkedIn</text>

<circle cx="499" cy="51.5" r="4.5" fill="#5fd4be"/>
<text x="511" y="56.18" class="m" font-size="13" font-weight="600" fill="#f2f6f8">LIVE</text><text x="42" y="110" class="t" font-size="29" font-weight="700" fill="#f2f6f8" letter-spacing="-.4">A Wristband That Knows When</text><text x="42" y="144" class="t" font-size="29" font-weight="700" fill="#f2f6f8" letter-spacing="-.4">You Fall</text><text x="42" y="182" class="t" font-size="19" fill="#a9b8c4">STM32 firmware reads an IMU and streams motion data</text><text x="42" y="207" class="t" font-size="19" fill="#a9b8c4">over BLE.</text>
<text x="42" y="246" class="t" font-size="30" font-weight="700" fill="#5fd4be" letter-spacing="-.5">85%<tspan font-size="16" font-weight="500" fill="#a9b8c4" dx="10">detection accuracy</tspan></text>
<text x="558" y="246" text-anchor="end" class="m" font-size="13" fill="#6f8396">CHIPMANGO  ↗</text>

<defs>
  <clipPath id="c216"><rect x="14" y="14" width="572" height="262" rx="30"/></clipPath>
  <filter id="f217" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/><feColorMatrix type="saturate" values="1.6"/></filter>
  <filter id="sh220" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="21" flood-color="rgba(0,0,0,0.55)"/></filter>
  <linearGradient id="r218" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="rgba(255,255,255,0.55)"/><stop offset=".5" stop-color="rgba(255,255,255,0.06)"/><stop offset="1" stop-color="rgba(255,255,255,0.22)"/>
  </linearGradient>
  <linearGradient id="s219" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="rgba(255,255,255,0.14)"/><stop offset=".5" stop-color="rgba(255,255,255,0.14)" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="14" y="14" width="572" height="262" rx="30" fill="#050b14" opacity=".35" filter="url(#sh220)"/>
<g clip-path="url(#c216)">
  <use href="#bg214" xlink:href="#bg214" filter="url(#f217)"/>
  <rect x="14" y="14" width="572" height="262" fill="rgba(6,14,26,0.6)"/>
  <rect x="14" y="14" width="572" height="262" fill="url(#s219)"/>
</g>
<rect x="14.75" y="14.75" width="570.5" height="260.5" rx="29.25" fill="none" stroke="url(#r218)" stroke-width="1.5"/>
<rect x="42" y="38" width="51" height="27" rx="13.5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>

<text x="54" y="56.18" class="m" font-size="13" font-weight="600" fill="#a9b8c4">CH1</text><rect x="101" y="38" width="51" height="27" rx="13.5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>

<text x="113" y="56.18" class="m" font-size="13" font-weight="600" fill="#a9b8c4">CH2</text><rect x="160" y="38" width="51" height="27" rx="13.5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>


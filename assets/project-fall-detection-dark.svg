<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="290" viewBox="0 0 600 290" role="img" aria-label="A Wristband That Knows When You Fall: STM32 firmware reads an IMU and streams motion data over BLE. 85% detection accuracy">
<title>A Wristband That Knows When You Fall: STM32 firmware reads an IMU and streams motion data over BLE. 85% detection accuracy</title>
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .m{font-family:'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.06em}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,20px)}}
  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,30px)}}
  .o1{animation:drift1 14s ease-in-out infinite}
  .o2{animation:drift2 18s ease-in-out infinite}
  .o3{animation:drift3 16s ease-in-out infinite}
  
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="outer221"><rect width="600" height="290" rx="34"/></clipPath></defs>
<g clip-path="url(#outer221)">
<defs><filter id="wb215" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="290" viewBox="0 0 600 290" role="img" aria-label="Hearing Disease in Breath Sounds: COPD and pneumonia classified from recorded lung sounds. 99% classification accuracy">
